<!DOCTYPE html>
<html lang="zh-Hant" data-locale="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faculty | International Management (imMBA)</title>
  <link rel="icon" href="assets/img/immba-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=nav-caret">
</head>
<body class="page-faculty">
  <div id="site-header"></div>
  <main id="main">
    <header class="page-hero">
      <div class="wrap">
        <p class="crumbs"><a href="index.html">imMBA</a> / <span class="zh">師資介紹</span><span class="en">Faculty</span></p>
        <h1><span class="zh">師資介紹</span><span class="en">Faculty</span></h1>
        <p class="lead">
          <span class="zh">資料來自輔大國際經管(imMBA)官方網站</span>
          <span class="en">Content from the official Fu Jen imMBA website</span>
        </p>
      </div>
    </header>
    <section class="section">
      <div class="wrap faculty-page">
        <div class="faculty-toolbar">
          <input id="faculty-q" type="search" placeholder="Search / 搜尋姓名">
          <select id="faculty-type">
            <option value="all">全部 / All</option>
            <option value="full">專任教師 / Full-Time Faculty</option>
            <option value="adjunct">兼任教師 / Part-Time Faculty</option>
          </select>
        </div>

        <p class="faculty-load-status" id="faculty-load-status" hidden></p>

        <div class="faculty-group" data-faculty-group="full">
          <h2><span class="zh">專任教師</span><span class="en">Full-Time Faculty</span></h2>
          <div class="faculty-grid" id="faculty-grid-full"></div>
        </div>

        <div class="faculty-group" data-faculty-group="adjunct">
          <h2><span class="zh">兼任教師</span><span class="en">Part-Time Faculty</span></h2>
          <div class="faculty-grid" id="faculty-grid-adjunct"></div>
        </div>

        <img class="overview-badge" src="assets/img/aacsb-accredited.png" alt="AACSB Accredited">
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/faculty-api.js?v=official-photos"></script>
  <script src="assets/js/site.js?v=footer-clean"></script>
  <script src="assets/js/faculty-page.js?v=photo-left"></script>
</body>
</html>
